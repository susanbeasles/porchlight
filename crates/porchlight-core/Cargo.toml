[package]
name = "porchlight-core"
description = "Porchlight core: event schema, store, ingest and pipeline. No Apple framework dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["pipeline"]
# The extension links this crate with default-features = false: schema and ingest only.
store = ["dep:rusqlite"]
pipeline = ["store"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, optional = true }

[lints]
workspace = true
