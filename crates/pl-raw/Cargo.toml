[package]
name = "pl-raw"
description = "PLRawEvent layout, the SPSC ring, raw-to-schema decoding and the extension bridge logic. No ES dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"
links = "pl_raw_c"

[dependencies]
pl-core = { workspace = true, default-features = false, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
cc.workspace = true

# Workspace lints, except unsafe is denied (not forbidden) so the FFI modules can opt in.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
