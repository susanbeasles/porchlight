[package]
name = "pl-core"
description = "Porchlight core: event schema, store, ingest and pipeline. No Apple framework dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Default is schema and ingest only, so the privileged extension cannot pull in SQLite by
# forgetting `default-features = false` (ADR-0001, ADR-0004). Tools opt into `pipeline`.
default = ["schema"]
schema = []
store = ["dep:rusqlite"]
pipeline = ["store"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, optional = true }

[lints]
workspace = true
