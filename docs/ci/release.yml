# Release: seal a version on every push to main (ADR-0008).
#   build -> draft release -> SHA256SUMS + cosign sign/attest -> upload -> verify -> publish
#   -> dispatch deploy.yml at the new tag, which publishes the sealed tarball to npm.
# Agents may not write .github/workflows/; the owner copies this file there and sets
# working-directory and entry for the package being released.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write           # draft, upload, publish the release
      id-token: write           # cosign keyless signing
      actions: write            # dispatch deploy.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0        # versioning reads commits since the last v* tag
          persist-credentials: false

      - id: build
        uses: ./actions/npm-build
        with:
          working-directory: packages/example
          entry: src/index.ts
          max-bundle-bytes: "65536"

      - id: draft
        if: steps.build.outputs.version != ''
        uses: ./actions/sealed-release
        with:
          phase: draft
          tag: ${{ steps.build.outputs.tag }}

      - id: sign
        if: steps.build.outputs.version != ''
        uses: ./actions/cosign-attest
        with:
          subjects: ${{ steps.build.outputs.tarball }}
          checksums-file: ${{ runner.temp }}/npm-pack/SHA256SUMS

      - id: publish
        if: steps.build.outputs.version != ''
        uses: ./actions/sealed-release
        with:
          phase: publish
          tag: ${{ steps.build.outputs.tag }}
          release-id: ${{ steps.draft.outputs.release-id }}
          files: ${{ steps.sign.outputs.files }}

      - name: Deploy the sealed release to npm
        if: steps.build.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.build.outputs.tag }}
        # workflow_dispatch is one of the two events a GITHUB_TOKEN may trigger.
        run: gh workflow run deploy.yml --ref "$TAG" -f tag="$TAG"
