# Example release workflow for the S1 and S2 actions (ADR-0008).
# Agents may not write .github/workflows/; the owner copies this file there and edits
# working-directory and entry for the package being released.
#
# One-time setup on npmjs.com: package → Settings → Trusted publishing → GitHub Actions,
# repository susanbeasles/porchlight, workflow file release.yml, environment npm.
# Then remove every npm automation token for the package and set "Require two-factor
# authentication and disallow tokens".
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: npm            # gate with required reviewers if you want a human in the loop
    permissions:
      contents: write           # GitHub release + bundle upload
      id-token: write           # npm trusted publishing and cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0        # versioning reads commits since the last v* tag
          persist-credentials: false

      - id: npm
        uses: ./actions/npm-trusted-publish
        with:
          working-directory: packages/example
          entry: src/index.ts
          max-bundle-bytes: "65536"

      - if: steps.npm.outputs.version != ''
        uses: ./actions/cosign-attest
        with:
          subjects: ${{ steps.npm.outputs.tarball }}
          release-tag: ${{ steps.npm.outputs.tag }}
