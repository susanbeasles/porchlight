# Proposed .github/workflows/rust.yml. Workflow files are human-owned; copy this there.
name: Rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install system SQLite headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check
        run: scripts/check
