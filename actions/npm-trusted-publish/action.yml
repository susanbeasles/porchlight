name: npm trusted publish
description: >
  Publish a sealed GitHub release to npmjs.org. Downloads the release assets, verifies the
  signed SHA256SUMS, the tarball's cosign signature and its SLSA provenance (including that
  it was built from this exact commit), then publishes that tarball byte for byte through
  OIDC trusted publishing with npm provenance. Builds nothing. Accepts no npm token.

# Caller requirements (see README.md):
#   on: workflow_dispatch only, run at the release tag (gh workflow run --ref <tag>)
#   permissions: { contents: read, id-token: write }
#   npm trusted publisher configured for this repository and the calling workflow file

inputs:
  tag:
    description: Release tag to publish (v<major>.<minor>.<patch>). The run's ref must be this tag.
    required: true
  package-name:
    description: >
      The package name activated in release/npm.json at this tag (release-gate output).
      The tarball must carry exactly this name.
    required: true
  signer-identity:
    description: >
      Certificate identity the release was signed with. Defaults to
      https://github.com/<repo>/.github/workflows/release.yml@refs/heads/main.
    default: ""
  node-version:
    description: Node.js version.
    default: "22"
  npm-version:
    description: npm CLI version. Trusted publishing needs 11.5.1 or later.
    default: "11.5.1"
  cosign-release:
    description: cosign version used for verification.
    default: v3.1.3
  dry-run:
    description: Verify everything, publish nothing.
    default: "false"
  github-token:
    description: Token to read the release (contents read).
    default: ${{ github.token }}

outputs:
  package:
    description: Package name.
    value: ${{ steps.verify.outputs.package }}
  version:
    description: Version verified (and published unless dry-run or already on npm).
    value: ${{ steps.verify.outputs.version }}
  tarball:
    description: Path of the verified tarball.
    value: ${{ steps.verify.outputs.tarball }}

runs:
  using: composite
  steps:
    - name: Preflight
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        NODE_AUTH_TOKEN_SET: ${{ env.NODE_AUTH_TOKEN != '' }}
      run: bash "$GITHUB_ACTION_PATH/preflight.sh"

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ inputs.cosign-release }}

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
        # No registry-url: it writes an .npmrc that reads NODE_AUTH_TOKEN, and the
        # default registry is already registry.npmjs.org. OIDC supplies the credential.
        package-manager-cache: false

    - name: Install npm with trusted publishing support
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm-version }}
      run: npm install --global --ignore-scripts "npm@$NPM_VERSION" && npm --version

    - name: Download and verify the sealed release
      id: verify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        IDENTITY: ${{ inputs.signer-identity }}
        EXPECT_NAME: ${{ inputs.package-name }}
      run: bash "$GITHUB_ACTION_PATH/verify.sh"

    - name: Publish to npm (OIDC trusted publishing, provenance)
      shell: bash
      env:
        PACKAGE: ${{ steps.verify.outputs.package }}
        VERSION: ${{ steps.verify.outputs.version }}
        TARBALL: ${{ steps.verify.outputs.tarball }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "$GITHUB_ACTION_PATH/publish.sh"
