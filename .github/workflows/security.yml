# Security: the workflow_depot security-assurance suite on every push, every PR and daily.
# All policy lives in the depot (14 hash-pinned scanners plus Semgrep, CodeQL, SCA, SBOM, IaC,
# forensics and a signed evidence bundle); this caller only pins it. Bump both SHAs together.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # daily rescan: advisories change even when code does not

# One run per commit: a push and its pull_request event share the head SHA, so the later
# run cancels the earlier one instead of scanning the same commit twice.
concurrency:
  group: security-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  security:
    uses: susanbeasles/workflow_depot/.github/workflows/security-assurance.yml@2af7a7e031d86a88f7a3ad3e07c5c9f963701b36
    permissions:
      contents: read
      security-events: write   # CodeQL SARIF upload
      id-token: write          # evidence-sign job only (job-level in the reusable workflow)
    with:
      depot_repository: susanbeasles/workflow_depot
      depot_ref: 2af7a7e031d86a88f7a3ad3e07c5c9f963701b36   # must equal the SHA in `uses:`
      policy_profile: ci-baseline
      # Compiled-language CodeQL needs a build; without one SAST-CODEQL for Rust is unavailable.
      # Executes this repository's own code on a GitHub-hosted runner.
      codeql_build_command: "sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev && cargo build --workspace --locked"
      # AI review stays off and no API key is passed: no source leaves for a model provider.
      # Swift CodeQL needs a macOS runner; the Swift app is a thin AppKit/SystemExtensions shell.
      # Semgrep (p/swift) and SwiftLint still gate it; Rust, C and Actions CodeQL still run.
      codeql_waive_languages: swift
